[package]
name = "zomp_shell"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { path = "../gpui" }
gpui_platform = { path = "../gpui_platform", features = ["font-kit", "runtime_shaders"] }
# 宿主 NSWindow / WKWebView / NSButton 走与 omp_embed_spike 相同的 objc 0.2 + cocoa 体系
# （objc2-app-kit 缺 NSApplication feature，这里不引入）
objc = { workspace = true }
cocoa = { workspace = true }
