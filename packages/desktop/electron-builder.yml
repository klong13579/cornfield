# CornField —— electron-builder 打包配置。
# 一键打包入口：bun run build:desktop（先构建 web-app 与 cornfield，再 electron-builder 出 dmg/zip）。
appId: com.cornfield.desktop
productName: CornField
# artifactName 用连字符命名（无空格）避免 GitHub Release 上传时把空格替换成点导致
# latest-mac.yml 里的 URL 与真实资产名不匹配（客户端 updater 下载 404）。
artifactName: CornField-${version}-${arch}.${ext}
directories:
  output: dist
files:
  # 只打包编译后的壳 JS（esbuild 产物）。electron-builder 输出目录也在 dist/ 下，
  # 用显式文件列表而非 dist/** 以避免二次构建时把上一次的 app/dmg 递归收进 asar。
  - dist/main.js
  - dist/sidecar.js
  - dist/preload.cjs
extraResources:
  # 内嵌 cornfield 二进制（对应 sidecar.ts resolveOmpBinary 的 packaged 路径 cornfield-binary/cornfield）。
  - from: ../coding-agent/dist/cornfield
    to: cornfield-binary/cornfield
  # 内嵌 web-app 生产构建（对应 main.ts 生产模式 loadFile(resources/renderer/index.html)）。
  - from: ../web-app/dist
    to: renderer
# publish 配置驱动 electron-builder 生成更新元数据（latest-mac.yml）——
# 没有它客户端 updater 拿不到版本对比文件，更新流永远检查不到新版本（2026-08-21 实测验证抓到）。
# 用 generic provider + 空 url：只在本地构建时生成 latest-mac.yml（不上传，不要求 GH_TOKEN）；
# 实际发布时 CI release_desktop job 把 dmg/zip/latest* 上传到 GitHub Release，
# 客户端默认走 github provider（main.ts），或经 OMP_UPDATE_MIRROR 走任意 generic URL。
publish:
  provider: generic
  url: ""
mac:
  # 应用图标：build/icon.icns（由 assets/cornfield-icon.svg 生成，iconutil 打包）。
  icon: build/icon.icns
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  # adhoc 签名（identity "-"）：本地构建免 Gatekeeper 弹窗（右键打开），不含公证。
  # 正式对外发布前替换为 Developer ID Application 证书名 + notarize 配置。
  identity: "-"
