# omp 配置 (runtime 硬依赖, 详见设计 §6.1a #5)
# omp --mode rpc 启动时读取本文件
# 用于覆盖 omp 全局配置 (modelRoles, theme 等)

modelRoles:
  default: narwal-plan/minimax-m3   # 该 agent 使用的默认模型
  smol: narwal-plan/minimax-m3       # 轻量任务（文本处理、简单问题）
  slow: narwal-plan/glm-5.2          # 复杂任务（代码生成、深入分析）

hideThinkingBlock: true                 # 隐藏思考块（TUI + 钉钉 AI Card 共用；gateway 以本文件为准）
defaultThinkingLevel: medium            # 思维链深度（low / medium / high）

# theme: dark                          # 主题（dark / light）

# browser:
#   headless: false                    # 浏览器模式
#   persistState: true                 # 跨会话保持浏览器状态

bash:
  autoBackground:
    enabled: true                      # bash 长命令自动后台化

async:
  enabled: true

disabledExtensions:                    # 本 agent 禁用的扩展（按需增删）
  - skill:gitnexus-cli
  - skill:gitnexus-guide
