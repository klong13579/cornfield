<!--
页面名：移动端会话 (Mobile Session) — V6 图形收敛
功能层级位置：OMP 多端前端 > 移动端精简视图
路由路径：#/mobile/workspace
导航分组：mobile（经桌面页「预览手机」访问）
覆盖协议：prompt, steer, abort, get_snapshot, subscribe · session_snapshot, progress
覆盖协议（Jarvis 语音）：voice 页 → prompt（语音转文字后发送）
设计决策：右面板→浮层、模型/thinking→快捷条、工具卡默认折叠、触控 44px、语音快捷入口。
V6：状态圆点 8px 语义色、徽标文字化、亮色 token。
-->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>omp · 移动端</title>
<style>
  :root {
    --canvas: #f7f7f8; --surface: #ffffff; --surface-2: #f0f0f2; --surface-3: #e6e6e9;
    --hairline: rgba(24,24,27,0.09); --hairline-strong: rgba(24,24,27,0.18);
    --ink: #18181b; --ink-muted: rgba(24,24,27,0.66); --ink-subtle: rgba(24,24,27,0.5); --ink-faint: rgba(24,24,27,0.34);
    --accent: #18181b; --accent-hover: #3a3a3f; --accent-dim: rgba(24,24,27,0.08); --on-accent: #fafafa;
    --success: #189a5c; --warning: #b97c1e; --danger: #d64545;
    --user-bg: #ececee;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
    --r-sm: 6px; --r-md: 8px; --r-lg: 12px;
    --ease: 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--canvas); color: var(--ink); font: 400 15px/1.6 var(--font); letter-spacing: -0.05px; max-width: 430px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  #topbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--hairline); background: var(--surface); flex-shrink: 0; }
  .conn { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--success); }
  .conn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
  .spacer { flex: 1; }
  .top-btn { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-sm); padding: 5px 10px; font-size: 12px; color: var(--ink); cursor: pointer; transition: all var(--ease); }
  .top-btn:hover { border-color: var(--hairline-strong); }
  .top-btn.agent { color: var(--accent-hover); }

  #quickbar { display: flex; gap: 8px; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--hairline); overflow-x: auto; flex-shrink: 0; }
  .quick-chip { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-sm); padding: 4px 10px; font-size: 12px; color: var(--ink-subtle); white-space: nowrap; cursor: pointer; }
  .quick-chip b { color: var(--ink); font-weight: 500; }

  #transcript { flex: 1; overflow-y: auto; padding: 16px 14px; }
  .msg { display: flex; gap: 10px; margin-bottom: 20px; }
  .avatar { width: 24px; height: 24px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 600; flex-shrink: 0; margin-top: 2px; }
  .avatar.user { background: #dde1ec; color: #3b4666; }
  .avatar.assistant { background: #d8efe2; color: #127a48; }
  .bubble { flex: 1; min-width: 0; }
  .bubble .name { font-size: 10px; color: var(--ink-faint); margin-bottom: 3px; }
  .bubble .content { color: var(--ink-muted); font-size: 14px; }
  .msg.user .bubble .content { color: var(--ink); background: var(--user-bg); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 9px 12px; }
  .msg.user .bubble { display: flex; flex-direction: column; align-items: flex-end; }
  .msg.user .bubble .content { max-width: 85%; }
  p { margin-bottom: 6px; }
  p:last-child { margin-bottom: 0; }
  code { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 4px; padding: 1px 4px; font-size: 12px; font-family: var(--mono); color: var(--ink); letter-spacing: 0; }
  .caret { display: inline-block; width: 2px; height: 13px; background: var(--accent-hover); border-radius: 1px; vertical-align: -2px; animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

  .toolcard { border: 1px solid var(--hairline); border-radius: var(--r-sm); background: var(--surface); margin: 8px 0; overflow: hidden; }
  .toolcard .head { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
  .toolcard .head .tname { font-family: var(--mono); color: var(--ink); font-weight: 500; letter-spacing: 0; }
  .toolcard .body { display: none; padding: 6px 10px; font-family: var(--mono); font-size: 11px; color: var(--ink-subtle); white-space: pre-wrap; border-top: 1px solid var(--hairline); letter-spacing: 0; }
  .toolcard .body.show { display: block; }
  .toolcard .body .result { color: var(--success); }
  .toolcard .body .result::before { content: "✓ "; font-family: var(--font); }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 500; margin-left: auto; }
  .badge.done { color: var(--success); background: rgba(76,183,130,0.1); }

  #inputbar { border-top: 1px solid var(--hairline); padding: 10px 14px; background: var(--surface); display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
  #input { flex: 1; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 9px 12px; color: var(--ink); font: inherit; resize: none; outline: none; min-height: 42px; font-size: 14px; transition: border-color var(--ease), box-shadow var(--ease); }
  #input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  #input::placeholder { color: var(--ink-faint); }
  .icon-btn { width: 42px; height: 42px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--hairline); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-muted); transition: all var(--ease); flex-shrink: 0; }
  .icon-btn:hover { border-color: var(--hairline-strong); color: var(--ink); }
  .icon-btn.send { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .icon-btn.stop { background: var(--danger); border-color: var(--danger); color: #fff; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 10; }
  .overlay.show { display: flex; align-items: flex-end; }
  .overlay-panel { width: 100%; max-height: 60vh; background: var(--surface); border-radius: var(--r-lg) var(--r-lg) 0 0; border-top: 1px solid var(--hairline-strong); padding: 20px; overflow-y: auto; }
  .overlay-panel h4 { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-weight: 600; }
  .kv { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
  .kv .k { color: var(--ink-subtle); }
  .todo { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; font-size: 13px; color: var(--ink-muted); }
  .todo input { margin-top: 3px; accent-color: var(--accent); }
  .todo.done .t { color: var(--ink-faint); text-decoration: line-through; }
  .overlay-close { text-align: center; padding: 10px; color: var(--accent-hover); font-size: 14px; cursor: pointer; }
  .bar { height: 3px; background: var(--surface-3); border-radius: 2px; overflow: hidden; margin: 8px 0 4px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  </defs>
</svg>

<div id="topbar">
  <div class="conn">已连接</div>
  <div class="spacer"></div>
  <button class="top-btn agent" onclick="location.href='agent-list.html'">研发助手 ▾</button>
  <button class="top-btn" onclick="toggleOverlay()">详情</button>
</div>

<div id="quickbar">
  <span class="quick-chip">模型 <b>qwen3.7-max</b></span>
  <span class="quick-chip">thinking <b>high</b></span>
  <span class="quick-chip" onclick="location.href='voice.html'">语音</span>
</div>

<div id="transcript">
  <div class="msg user">
    <div class="bubble">
      <div class="name">你</div>
      <div class="content"><p>帮我查一下 gateway 为什么在 00:20:30 消息丢失</p></div>
    </div>
    <div class="avatar user">你</div>
  </div>

  <div class="msg assistant">
    <div class="avatar assistant">π</div>
    <div class="bubble">
      <div class="name">omp · qwen3.7-max</div>
      <div class="content">
        <div class="toolcard" onclick="this.querySelector('.body').classList.toggle('show')">
          <div class="head"><span class="tname">read</span><span class="badge done">完成</span></div>
          <div class="body">~/.omp/gateway-data/logs/service.log
<span class="result">00:20:30 [AgentBridge] bridge crashed (SIGKILL)</span></div>
        </div>
        <p>根因是 SIGKILL 导致哨兵没写入。<span class="caret"></span></p>
      </div>
    </div>
  </div>
</div>

<div id="inputbar">
  <button class="icon-btn" onclick="location.href='voice.html'" title="语音输入"><svg class="icon"><use href="#i-mic"/></svg></button>
  <textarea id="input" rows="1" placeholder="发送消息…">继续</textarea>
  <button class="icon-btn send" id="sendBtn" onclick="toggleSend()"><svg class="icon"><use href="#i-send"/></svg></button>
</div>

<div class="overlay" id="overlay" onclick="if(event.target===this) toggleOverlay()">
  <div class="overlay-panel">
    <h4>会话状态</h4>
    <div class="kv"><span class="k">阶段</span><span style="color:var(--warning)">streaming</span></div>
    <div class="kv"><span class="k">模型</span><span>qwen3.7-max</span></div>
    <div class="kv"><span class="k">上下文</span><span>62% · 22 条消息</span></div>
    <div class="bar"><div style="width:62%"></div></div>
    <h4 style="margin-top:16px">会话 Todo · 4</h4>
    <label class="todo done"><input type="checkbox" checked><span class="t">复现 00:20:30 消息丢失</span></label>
    <label class="todo done"><input type="checkbox" checked><span class="t">确认 SIGKILL 路径</span></label>
    <label class="todo"><input type="checkbox"><span class="t">给 stop 加 30s 超时</span></label>
    <label class="todo"><input type="checkbox"><span class="t">回归验证重启恢复</span></label>
    <div class="overlay-close" onclick="toggleOverlay()">关闭</div>
  </div>
</div>

<script>
function toggleOverlay() { document.getElementById("overlay").classList.toggle("show"); }
let streaming = true;
function toggleSend() {
  const btn = document.getElementById("sendBtn");
  streaming = !streaming;
  btn.innerHTML = streaming ? '<svg class="icon"><use href="#i-stop"/></svg>' : '<svg class="icon"><use href="#i-send"/></svg>';
  btn.className = streaming ? "icon-btn stop" : "icon-btn send";
}
document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); toggleSend(); }
});
</script>
</body>
</html>
