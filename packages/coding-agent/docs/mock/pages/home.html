<!--
页面名：Home 欢迎页 (Home / Empty State)
功能层级位置：OMP 多端前端 > Home（默认起始页）
路由路径：#/home
导航分组：primary（第 1 位）
覆盖协议：get_state（环境摘要）、subscribe（活跃 agent 状态）
设计模式：EmptyState 行业标准（Greeting → Suggestions → Composer，staggered fade-in + slide-up）
注：问候语中「彭梦龙」为 mock 数据，未来来自 user profile（pi-client 提供）；环境摘要同理来自 get_state 快照。
-->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>omp · Home</title>
<style>
  :root {
    --canvas: #f7f7f8; --surface: #ffffff; --surface-2: #f0f0f2; --surface-3: #e6e6e9;
    --hairline: rgba(24,24,27,0.09); --hairline-strong: rgba(24,24,27,0.18);
    --ink: #18181b; --ink-muted: rgba(24,24,27,0.66); --ink-subtle: rgba(24,24,27,0.5); --ink-faint: rgba(24,24,27,0.34);
    --accent: #18181b; --accent-hover: #3a3a3f; --accent-dim: rgba(24,24,27,0.08); --on-accent: #fafafa;
    --success: #189a5c; --warning: #b97c1e; --danger: #d64545;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
    --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
    --ease: 150ms cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--canvas); color: var(--ink); font: 400 14px/1.6 var(--font); letter-spacing: -0.05px; -webkit-font-smoothing: antialiased; }
  .icon { width: 18px; height: 18px; stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ── 侧栏（数据驱动：nav 数组在底部 script） ── */
  #nav { width: 60px; background: var(--surface); border-right: 1px solid var(--hairline); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; flex-shrink: 0; }
  .nav-item { width: 40px; height: 40px; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--ink-faint); transition: all var(--ease); position: relative; }
  .nav-item:hover { background: var(--surface-2); color: var(--ink-subtle); }
  .nav-item.active { background: var(--accent-dim); color: var(--accent-hover); }
  .nav-item.active::before { content: ""; position: absolute; left: -10px; width: 2px; height: 18px; background: var(--accent); border-radius: 1px; }
  .nav-spacer { flex: 1; }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow-y: auto; }

  /* ── EmptyState 居中容器 ── */
  #stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 32px; gap: 28px; max-width: 640px; margin: 0 auto; width: 100%; }

  /* Greeting：入场 500ms */
  .greeting { text-align: center; animation: rise 500ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .greeting h1 { font-size: 32px; font-weight: 600; letter-spacing: -0.8px; line-height: 1.25; }
  .greeting .sub { font-size: 14px; color: var(--ink-subtle); margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .greeting .sub .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px rgba(76,183,130,0.5); }

  /* Suggestions：错峰入场（120ms + index*70ms） */
  .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .pill { background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-full); padding: 8px 16px; font-size: 13px; color: var(--ink-muted); cursor: pointer; transition: all var(--ease); display: flex; align-items: center; gap: 7px; animation: rise 500ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .pill .icon { width: 14px; height: 14px; color: var(--ink-subtle); }
  .pill:hover { border-color: var(--hairline-strong); color: var(--ink); transform: translateY(-1px); }
  .pill:hover .icon { color: var(--accent-hover); }
  .pill:active { transform: scale(0.96); }

  /* Composer：最后入场 360ms 延迟 */
  .composer { width: 100%; max-width: 560px; display: flex; gap: 10px; align-items: flex-end; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: 24px; padding: 8px 8px 8px 18px; transition: border-color var(--ease), box-shadow var(--ease); animation: rise 500ms cubic-bezier(0.16, 1, 0.3, 1) 360ms both; }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-dim); }
  .composer input { flex: 1; background: none; border: none; color: var(--ink); font: inherit; font-size: 14px; outline: none; padding: 6px 0; }
  .composer input::placeholder { color: var(--ink-faint); }
  .composer-send { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); border: none; color: var(--on-accent); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background var(--ease); flex-shrink: 0; }
  .composer-send:hover { background: var(--accent-hover); }
  .composer-send .icon { width: 16px; height: 16px; }
  .composer-hint { width: 100%; max-width: 560px; display: flex; justify-content: center; gap: 16px; font-size: 11px; color: var(--ink-faint); animation: rise 500ms cubic-bezier(0.16, 1, 0.3, 1) 440ms both; }
  .kbd { font-family: var(--mono); font-size: 10px; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); border: 1px solid var(--hairline); color: var(--ink-subtle); }

  /* 活跃 agent 次要区 */
  .recent { width: 100%; max-width: 560px; animation: rise 500ms cubic-bezier(0.16, 1, 0.3, 1) 520ms both; }
  .recent-title { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; margin-bottom: 10px; text-align: center; }
  .recent-list { display: flex; gap: 10px; justify-content: center; }
  .recent-card { background: var(--surface); border: 1px solid var(--hairline); border-radius: var(--r-lg); padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all var(--ease); min-width: 160px; }
  .recent-card:hover { border-color: var(--hairline-strong); transform: translateY(-1px); }
  .recent-face { width: 28px; height: 28px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: #fff; flex-shrink: 0; }
  .recent-face.a { background: #5e6ad2; }
  .recent-face.b { background: #3a7d5d; }
  .recent-face.c { background: #b8823a; }
  .recent-info { min-width: 0; }
  .recent-name { font-size: 13px; font-weight: 500; }
  .recent-action { font-size: 11px; color: var(--ink-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .recent-status { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; margin-left: auto; }
  .recent-status.online { background: var(--success); box-shadow: 0 0 6px rgba(76,183,130,0.5); }
  .recent-status.busy { background: var(--warning); box-shadow: 0 0 6px rgba(229,168,59,0.5); animation: pulse 1.8s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @media (prefers-reduced-motion: reduce) { .greeting, .pill, .composer, .composer-hint, .recent { animation: none; } }

  /* ── 手机预览 ── */
  #phonePreviewBtn { position: fixed; top: 14px; right: 16px; z-index: 20; background: var(--surface-2); border: 1px solid var(--hairline); border-radius: var(--r-md); padding: 6px 12px; font-size: 12px; color: var(--ink-muted); cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all var(--ease); }
  #phonePreviewBtn:hover { border-color: var(--hairline-strong); color: var(--ink); }
  #phonePreviewBtn .icon { width: 14px; height: 14px; }
  #phoneOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 30; }
  #phoneOverlay.show { display: block; }
  #phonePanel { position: fixed; top: 0; right: 0; height: 100vh; width: 420px; background: var(--surface); border-left: 1px solid var(--hairline-strong); box-shadow: -16px 0 48px rgba(0,0,0,0.12); z-index: 31; display: none; flex-direction: column; }
  #phonePanel.show { display: flex; }
  .phone-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
  .phone-head .label { font-size: 12px; color: var(--ink-subtle); font-family: var(--mono); letter-spacing: 0; }
  .phone-close { margin-left: auto; background: none; border: none; color: var(--ink-subtle); cursor: pointer; font-size: 18px; padding: 4px 8px; border-radius: var(--r-sm); }
  .phone-close:hover { background: var(--surface-2); color: var(--ink); }
  .phone-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; overflow: hidden; }
  .device { width: 375px; height: 100%; max-height: 812px; border-radius: 40px; border: 1px solid var(--hairline-strong); background: var(--canvas); overflow: hidden; display: flex; flex-direction: column; position: relative; box-shadow: 0 24px 64px rgba(0,0,0,0.18); }
  .device-statusbar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; font-size: 12px; font-weight: 600; color: var(--ink); flex-shrink: 0; }
  .device-frame { flex: 1; overflow: hidden; }
  .device-frame iframe { width: 100%; height: 100%; border: none; }
  .device-home { height: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .device-home::after { content: ""; width: 120px; height: 4px; border-radius: 2px; background: var(--hairline-strong); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12c0 4.4-4 8-9 8-1.2 0-2.4-.2-3.4-.6L3 21l1.7-4.3C3.6 15.4 3 13.8 3 12c0-4.4 4-8 9-8s9 3.6 9 8z"/></symbol>
    <symbol id="i-bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M8 4h8"/><circle cx="9" cy="14" r="0.5"/><circle cx="15" cy="14" r="0.5"/><path d="M9 17h6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3"/></symbol>
    <symbol id="i-check-square" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  </defs>
</svg>

<button id="phonePreviewBtn" onclick="togglePhone(true)"><svg class="icon"><use href="#i-phone"/></svg>预览手机</button>

<div id="phoneOverlay" onclick="togglePhone(false)"></div>
<div id="phonePanel">
  <div class="phone-head">
    <span class="label">移动端预览 · 375×812</span>
    <button class="phone-close" onclick="togglePhone(false)">✕</button>
  </div>
  <div class="phone-body">
    <div class="device">
      <div class="device-statusbar"><span>9:41</span><span>omp</span><span>●●●</span></div>
      <div class="device-frame"><iframe src="mobile-session.html"></iframe></div>
      <div class="device-home"></div>
    </div>
  </div>
</div>

<div style="display:flex;height:100vh">
  <nav id="nav"></nav>

  <div id="main">
    <div id="stage">
      <!-- Greeting -->
      <div class="greeting">
        <div style="display:flex;align-items:center;justify-content:center;gap:14px">
          <canvas data-orb data-orb-state="breathing" data-orb-size="64" data-orb-theme="light" style="flex-shrink:0"></canvas>
          <h1 id="greetingText">下午好，彭梦龙</h1>
        </div>
        <div class="sub"><span class="dot"></span>oh-my-pi · main · 4 agent 运行中 · 2 定时任务待执行</div>
      </div>

      <!-- Suggestions：错峰入场 -->
      <div class="suggestions">
        <button class="pill" style="animation-delay:120ms" onclick="location.href='agent-detail.html'"><svg class="icon"><use href="#i-calendar"/></svg>检查今天的定时任务</button>
        <button class="pill" style="animation-delay:190ms" onclick="location.href='session-records.html'"><svg class="icon"><use href="#i-history"/></svg>最近会话回顾</button>
        <button class="pill" style="animation-delay:260ms" onclick="location.href='voice.html'"><svg class="icon"><use href="#i-mic"/></svg>语音记录一条指令</button>
        <button class="pill" style="animation-delay:330ms" onclick="location.href='model-marketplace.html'"><svg class="icon"><use href="#i-cpu"/></svg>切换模型</button>
        <button class="pill" style="animation-delay:400ms" onclick="location.href='agent-list.html'"><svg class="icon"><use href="#i-bot"/></svg>打开 Agent 管理</button>
      </div>

      <!-- Composer -->
      <div class="composer">
        <input id="composerInput" placeholder="给研发助手发一条指令…">
        <button class="composer-send" onclick="sendComposer()"><svg class="icon"><use href="#i-send"/></svg></button>
      </div>
      <div class="composer-hint">
        <span><span class="kbd">Enter</span> 发送直达会话工作台</span>
      </div>

      <!-- 活跃 agent -->
      <div class="recent">
        <div class="recent-title">最近活跃</div>
        <div class="recent-list">
          <div class="recent-card" onclick="location.href='agent-detail.html'">
            <div class="recent-face a">研</div>
            <div class="recent-info">
              <div class="recent-name">研发助手</div>
              <div class="recent-action">分析了 gateway 消息丢失</div>
            </div>
            <span class="recent-status online"></span>
          </div>
          <div class="recent-card" onclick="location.href='agent-detail.html'">
            <div class="recent-face b">运</div>
            <div class="recent-info">
              <div class="recent-name">运维 Agent</div>
              <div class="recent-action">执行每日代码审查</div>
            </div>
            <span class="recent-status busy"></span>
          </div>
          <div class="recent-card" onclick="location.href='agent-detail.html'">
            <div class="recent-face c">产</div>
            <div class="recent-info">
              <div class="recent-name">产品助理</div>
              <div class="recent-action">撰写 PRD 初稿</div>
            </div>
            <span class="recent-status busy"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  /* ── 应用壳：页面注册表（加页面 = 数组加一项） ── */
  const NAV = [
    { id: "home",       icon: "i-home",          label: "Home",      href: "home.html",              active: true },
    { id: "workspace",  icon: "i-chat",          label: "会话工作台",  href: "session-workspace.html" },
    { id: "agents",     icon: "i-bot",           label: "Agent 管理", href: "agent-list.html" },
    { id: "records",    icon: "i-clock",         label: "会话记录",    href: "session-records.html" },
    { id: "voice",      icon: "i-mic",           label: "语音",        href: "voice.html" },
    { id: "todo",       icon: "i-check-square",  label: "Todo 面板",  href: "todo-panel.html" },
    { id: "models",     icon: "i-cpu",           label: "模型市场",    href: "model-marketplace.html" },
    { id: "settings",   icon: "i-sliders",       label: "设置",        href: "settings.html",         bottom: true },
  ];
  document.getElementById("nav").innerHTML = NAV.map(n => `
    ${n.bottom ? '<div class="nav-spacer"></div>' : ""}
    <div class="nav-item${n.active ? " active" : ""}" title="${n.label}" onclick="location.href='${n.href}'">
      <svg class="icon"><use href="#${n.icon}"/></svg>
    </div>`).join("");

  /* 时间感问候（mock：未来来自 user profile，由 pi-client 提供） */
  const h = new Date().getHours();
  const greet = h < 6 ? "夜深了" : h < 12 ? "早上好" : h < 14 ? "中午好" : h < 18 ? "下午好" : "晚上好";
  document.getElementById("greetingText").textContent = `${greet}，彭梦龙`;

  /* Composer → 会话工作台 */
  function sendComposer() {
    const v = document.getElementById("composerInput").value.trim();
    location.href = "session-workspace.html" + (v ? "?q=" + encodeURIComponent(v) : "");
  }
  document.getElementById("composerInput").addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); sendComposer(); }
  });

  /* 手机预览 */
  function togglePhone(show) {
    document.getElementById("phoneOverlay").classList.toggle("show", show);
    document.getElementById("phonePanel").classList.toggle("show", show);
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape") togglePhone(false); });
</script>
<script src="../orbs-engine.js"></script>
<script src="../orbs.js"></script>
</body>
</html>
