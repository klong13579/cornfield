<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Task Control Plane — Mock</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#17202a;--muted:#73808c;--line:#e3e8ec;--blue:#2864dc;--blue-soft:#eaf0ff;--green:#16845b;--green-soft:#e6f6ef;--amber:#a66800;--amber-soft:#fff4d9;--red:#bd3b43;--purple:#7651bb;--shadow:0 12px 36px rgba(28,44,66,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC",sans-serif}button{font:inherit;border:0;cursor:pointer} .shell{display:flex;min-height:100vh}.rail{width:226px;background:#17202a;color:#d6dee6;padding:22px 14px}.brand{font-size:18px;font-weight:750;color:#fff;padding:0 12px 24px;letter-spacing:-.3px}.brand small{display:block;color:#82909d;font-size:11px;font-weight:500;margin-top:3px}.nav-title{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:#71808d;padding:18px 12px 8px}.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:#aebac5;margin:2px 0}.nav.active{background:#2b3947;color:#fff}.dot{width:7px;height:7px;border-radius:50%;background:#647382}.nav.active .dot{background:#68a1ff}.main{flex:1;min-width:0}.top{height:70px;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{color:var(--muted);font-size:13px}.crumb strong{color:var(--ink);font-weight:650}.top-actions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:8px 12px;color:#4c5965}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.ghost{background:transparent}.content{padding:30px 34px 58px;max-width:1480px;margin:auto}.heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:24px}.heading h1{font-size:29px;letter-spacing:-.8px;margin:0 0 5px}.heading p{margin:0;color:var(--muted)}.pills{display:flex;gap:7px}.pill{font-size:12px;padding:5px 9px;border-radius:100px;background:#edf0f3;color:#64717c}.pill.blue{background:var(--blue-soft);color:var(--blue)}.pill.green{background:var(--green-soft);color:var(--green)}.pill.amber{background:var(--amber-soft);color:var(--amber)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:24px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px 18px;box-shadow:var(--shadow)}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:24px;margin-top:7px;letter-spacing:-.5px}.stat em{font-style:normal;color:var(--green);font-size:11px;margin-left:6px}.board{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:13px;overflow:auto}.column{min-width:190px}.col-head{display:flex;justify-content:space-between;align-items:center;color:#52606c;font-weight:650;font-size:12px;padding:0 4px 10px}.count{color:#9aa5ae;font-weight:500}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 4px 14px rgba(28,44,66,.04);transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card h3{font-size:14px;margin:9px 0 8px;line-height:1.35}.card .source{color:var(--muted);font-size:11px;margin-bottom:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-foot{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.avatar{width:23px;height:23px;border-radius:50%;background:#dbe7ff;color:#2c60c6;display:inline-grid;place-items:center;font-size:10px;font-weight:700}.empty{border:1px dashed #cbd4dc;border-radius:10px;padding:22px 13px;text-align:center;color:#9aa5ae;font-size:12px}.layout-detail{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.panel-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}.panel-head h2{margin:0;font-size:18px;letter-spacing:-.3px}.panel-body{padding:20px}.section{padding:18px 0;border-bottom:1px solid var(--line)}.section:first-child{padding-top:0}.section:last-child{border-bottom:0;padding-bottom:0}.section h4{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:#89949e;margin:0 0 10px}.section p{margin:0;color:#37434d}.check{display:flex;gap:9px;align-items:flex-start;margin:9px 0;color:#43515d}.check i{width:16px;height:16px;border-radius:4px;border:1px solid #c9d2da;display:inline-grid;place-items:center;font-size:11px;color:#fff;font-style:normal;flex:none}.check.done i{background:var(--green);border-color:var(--green)}.meta{display:grid;grid-template-columns:100px 1fr;gap:10px;font-size:13px}.meta b{color:var(--muted);font-weight:500}.meta span{font-weight:600}.timeline{display:flex;flex-direction:column;gap:0}.event{display:grid;grid-template-columns:72px 18px 1fr;gap:8px;min-height:59px}.event time{color:#9aa5ae;font-size:11px;padding-top:2px}.event .line{position:relative}.event .line:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue);position:absolute;top:4px;left:1px}.event .line:after{content:"";width:1px;position:absolute;top:15px;bottom:-4px;left:5px;background:#d7e0e8}.event:last-child .line:after{display:none}.event strong{font-size:13px}.event p{margin:3px 0 0;color:var(--muted);font-size:12px}.proposal{background:linear-gradient(135deg,#fff,#f7f9ff);border:1px solid #dbe5ff;border-radius:12px;padding:18px;margin-bottom:18px}.proposal h2{margin:0 0 4px;font-size:17px}.proposal p{margin:0;color:var(--muted);font-size:12px}.split{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #e6ebf5}.split:first-of-type{margin-top:14px}.num{width:24px;height:24px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-size:11px;font-weight:700}.arrow{color:#a2afbd;font-size:12px}.risk{font-size:11px;color:var(--amber);background:var(--amber-soft);border-radius:5px;padding:3px 6px}.variant-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17202a;color:#fff;border-radius:100px;padding:7px 9px;display:flex;align-items:center;gap:13px;box-shadow:0 10px 35px rgba(0,0,0,.25);z-index:20;font-size:12px}.variant-bar button{width:25px;height:25px;border-radius:50%;background:#344454;color:#fff}.variant-bar span{min-width:150px;text-align:center}.muted{color:var(--muted)}.status-row{display:flex;align-items:center;gap:8px}.status-dot{width:8px;height:8px;border-radius:50%;background:#27a973}.run-box{background:#f7fafc;border:1px solid var(--line);border-radius:9px;padding:13px;margin-top:12px}.run-box strong{font-size:13px}.run-box p{font-size:12px;color:var(--muted);margin:5px 0 0}.side-actions{display:flex;gap:8px;padding:16px 20px;border-top:1px solid var(--line)}@media(max-width:950px){.rail{width:70px}.brand{font-size:0}.brand:after{content:"CA";font-size:18px}.brand small,.nav span,.nav-title{display:none}.nav{justify-content:center}.top{padding:0 18px}.content{padding:22px 18px 80px}.stats{grid-template-columns:repeat(2,1fr)}.layout-detail{grid-template-columns:1fr}.board{grid-template-columns:repeat(5,210px)}}
</style>
</head>
<body>
<div class="shell">
<aside class="rail"><div class="brand">CornField Agent<small>Task Control Plane</small></div><div class="nav active"><i class="dot"></i><span>任务控制面</span></div><div class="nav"><i class="dot"></i><span>待整理  6</span></div><div class="nav"><i class="dot"></i><span>运行中  2</span></div><div class="nav"><i class="dot"></i><span>待验收  3</span></div><div class="nav-title">上下文</div><div class="nav"><i class="dot"></i><span>TODO / Topics</span></div><div class="nav"><i class="dot"></i><span>Workers</span></div><div class="nav"><i class="dot"></i><span>执行记录</span></div></aside>
<main class="main"><header class="top"><div class="crumb">Agent Control / <strong id="crumb">Task Board</strong></div><div class="top-actions"><button class="btn ghost" onclick="toast('已同步 TODO/topic')">同步来源</button><button class="btn primary" onclick="showVariant(1)">整理提案</button></div></header><div class="content" id="app"></div></main>
</div>
<div class="variant-bar"><button onclick="cycle(-1)">←</button><span id="variantLabel">A · 任务看板</span><button onclick="cycle(1)">→</button></div>
<script>
const app=document.getElementById('app');let current=0;
const cards={triage:[['web-search 功能升级','topics/web-search.md','P2','待整理'],['OMP 桌面客户端','topics/omp-client-design.md','P1','待整理']],ready:[['统一搜索结果数据结构','web-search 功能升级','P1','可派发'],['定义 Tauri 与 Zed 边界','OMP 桌面客户端','P1','可派发']],running:[['实现 Agent 任务详情页','Task Control Plane v1','P1','运行中']],review:[['TaskRun 结构化报告','Task Control Plane v1','P1','待验收']],accepted:[['建立 session 事件桥','Task Control Plane v1','P2','已接受']]};
function card(c){return `<article class="card" onclick="showVariant(1)"><div class="pills"><span class="pill ${c[2]=='P1'?'blue':''}">${c[2]}</span><span class="pill">${c[3]}</span></div><h3>${c[0]}</h3><div class="source">↳ ${c[1]}</div><div class="card-foot"><span>验收 3 项</span><span class="avatar">CW</span></div></article>`}
function board(){return `<div class="heading"><div><h1>任务控制面</h1><p>把研发事项变成可派发、可恢复、可验收的 Agent 工作。</p></div><div class="pills"><span class="pill blue">手动派发</span><span class="pill green">控制面在线</span></div></div><div class="stats"><div class="stat"><div class="label">待整理</div><strong>6</strong></div><div class="stat"><div class="label">可派发</div><strong>4</strong><em>+2 本周</em></div><div class="stat"><div class="label">执行中</div><strong>2</strong></div><div class="stat"><div class="label">待验收</div><strong>3</strong><em>1 高风险</em></div></div><div class="board">${[['triage','待整理'],['ready','可派发'],['running','执行中'],['review','待验收'],['accepted','已接受']].map(([k,n])=>`<section class="column"><div class="col-head"><span>${n}</span><span class="count">${cards[k].length}</span></div>${cards[k].map(card).join('')}</section>`).join('')}</div>`}
function detail(){return `<div class="heading"><div><h1>Task 详情</h1><p>Worker 只能交付，验收和合并由控制面守门。</p></div><button class="btn" onclick="showVariant(0)">← 返回看板</button></div><div class="layout-detail"><section class="panel"><div class="panel-head"><div><div class="status-row"><span class="status-dot"></span><span class="pill green">RUNNING · run-002</span></div><h2 style="margin-top:10px">实现 Agent 任务详情页</h2><div class="muted" style="font-size:12px;margin-top:4px">Task ID task-01JX8K · 来源：Task Control Plane v1 · revision 3</div></div><span class="pill blue">P1</span></div><div class="panel-body"><div class="section"><h4>目标</h4><p>让 Lead 能看到任务定义、Worker 执行事实、验收证据和下一步动作，不需要翻 session 日志。</p></div><div class="section"><h4>交付结果</h4><div class="check done"><i>✓</i><span>Task 基本信息与来源 revision</span></div><div class="check done"><i>✓</i><span>TaskRun 时间线和 changed files</span></div><div class="check"><i></i><span>验收证据和人工合并入口</span></div></div><div class="section"><h4>执行活动</h4><div class="timeline"><div class="event"><time>10:31</time><div class="line"></div><div><strong>Worker 已启动</strong><p>coding-worker · 独立 Session · worktree</p></div></div><div class="event"><time>10:34</time><div class="line"></div><div><strong>完成页面骨架</strong><p>changedFiles: 3 · heartbeat 正常</p></div></div><div class="event"><time>10:37</time><div class="line"></div><div><strong>正在运行验证命令</strong><p>bun check:ts</p></div></div></div></div></div><div class="side-actions"><button class="btn">发送补充指令</button><button class="btn">暂停</button><button class="btn">取消</button></div></section><aside class="panel"><div class="panel-head"><h2>控制与验收</h2><span class="pill amber">待 Worker 报告</span></div><div class="panel-body"><div class="section"><h4>执行配置</h4><div class="meta"><b>Worker</b><span>coding-worker</span><b>Workspace</b><span>独立 worktree</span><b>Repository</b><span>cornfield</span><b>Attempt</b><span>2</span></div></div><div class="section"><h4>验收契约</h4><div class="check"><i></i><span>bun check:ts</span></div><div class="check"><i></i><span>bun test task-control</span></div><div class="check"><i></i><span>Verifier 独立检查 changed files</span></div></div><div class="section"><h4>下一步</h4><div class="run-box"><strong>Worker 完成后进入 review</strong><p>TaskRun succeeded 不等于 Task accepted。验收通过后才能请求人工合并。</p></div></div></div></aside></div>`}
function proposal(){return `<div class="heading"><div><h1>整理提案</h1><p>Agent 只提出拆分建议，确认后才生成正式 Task。</p></div><button class="btn" onclick="showVariant(0)">← 返回</button></div><div class="layout-detail"><section><div class="proposal"><h2>web-search 功能升级</h2><p>来源：TODO.md → topics/web-search.md · 当前 revision 7</p><div class="split"><span class="num">1</span><strong>统一搜索结果数据结构</strong><span class="risk">P1</span></div><div class="split"><span class="num">2</span><strong>实现客户端结果列表</strong><span class="arrow">依赖 1</span></div><div class="split"><span class="num">3</span><strong>支持点击查看详情</strong><span class="arrow">依赖 2</span></div><div class="split"><span class="num">4</span><strong>执行集成验收</strong><span class="arrow">依赖 3</span></div></div><div class="panel"><div class="panel-head"><h2>提案检查</h2><span class="pill amber">需确认 2 项</span></div><div class="panel-body"><div class="check done"><i>✓</i><span>单仓库边界明确：cornfield</span></div><div class="check done"><i>✓</i><span>代码任务默认 worktree</span></div><div class="check"><i></i><span>搜索结果详情页路径未确定</span></div><div class="check"><i></i><span>集成验收命令需要补充</span></div></div></div></section><aside class="panel"><div class="panel-head"><h2>确认提案</h2></div><div class="panel-body"><p class="muted">接受后将原子创建 4 个 Task。每个 Task 进入 draft，再独立预检，不会自动启动 Worker。</p><div class="section"><h4>建议风险</h4><span class="pill amber">medium · 普通代码修改</span></div><div class="section"><h4>生成后</h4><div class="check"><i></i><span>Task 集合写入控制面</span></div><div class="check"><i></i><span>依赖关系同时生效</span></div><div class="check"><i></i><span>等待人工指定 Worker</span></div></div></div><div class="side-actions"><button class="btn">修改提案</button><button class="btn primary" onclick="toast('已接受提案，生成 4 个 Task')">接受并生成</button></div></aside></div>`}
function showVariant(n){current=n;document.getElementById('crumb').textContent=n===0?'Task Board':n===1?'Task Detail':'Proposal Review';document.getElementById('variantLabel').textContent=[ 'A · 任务看板','B · 任务详情','C · 提案审核'][n];app.innerHTML=[board,detail,proposal][n]();}
function cycle(d){showVariant((current+d+3)%3)}function toast(t){const x=document.createElement('div');x.textContent=t;x.style='position:fixed;top:88px;right:28px;background:#17202a;color:#fff;padding:11px 16px;border-radius:8px;z-index:30;box-shadow:0 8px 20px #0003';document.body.append(x);setTimeout(()=>x.remove(),1800)}showVariant(0);
</script>
</body></html>
