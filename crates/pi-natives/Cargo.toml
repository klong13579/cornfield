[package]
name = "cornfield-natives"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[lints]
workspace = true


[features]
default = ["full"]
# full = CLI/TUI 全量功能集；client = 瘦身变体（不含语法高亮/剪贴板/PTY/音频/性能剖析）。
# 被排掉的模块源码与依赖保留在仓库（optional dep），未来用 `--features full` 即恢复。
full = [
	"dep:syntect",
	"dep:arboard",
	"dep:portable-pty",
	"dep:maudio",
	"dep:objc2",
	"dep:block2",
	"dep:windows-sys",
]
client = []
[dependencies]
mimalloc = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
napi = { version = "3", features = ["napi10", "tokio_rt", "tokio_time"] }
napi-derive = "3"
brush-core = { version = "0.4.0", path = "../brush-core-vendored" }
brush-builtins = { version = "0.1.0", path = "../brush-builtins-vendored" }
brush-parser = "0.3"
parking_lot = "0.12.5"
dashmap = "6.1"
clap = { version = "4", features = ["derive"] }
os_pipe = "1"
portable-pty = { version = "0.9", optional = true }
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
globset = "0.4"
ignore = "0.4"
rayon = "1.10"
ast-grep-core = { version = "0.39", default-features = false, features = [
   "tree-sitter",
] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-diff = "0.1"
tree-sitter-dockerfile = { version = "0.2.0", package = "tree-sitter-dockerfile-updated" }
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.23"
tree-sitter-lua = "0.2"
tree-sitter-md = "0.5"
tree-sitter-php = "0.24"
tree-sitter-python = "0.25"
tree-sitter-regex = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
inferno = { version = "0.12", default-features = false }
# flate2 1.1.10 引入 zlib-rs（运行时 SIMD dispatch 含 AVX-512 指令），
# 被 CI 的 x86-64-v2/v3 变体 ISA 检查命中。pin 到 1.1.9（无 zlib-rs）保持产物低于 x86-64-v4。
flate2 = "=1.1.9"
# crc32fast 1.5.0+ 在 x86_64 上通过 #[target_feature(enable = "avx512f", enable = "vpclmulqdq")]
# 无条件编译 AVX-512 CRC 路径（runtime dispatch，rustc >= 1.89 即有），绕过外层
# -C target-cpu=x86-64-v2/v3 限制，导致 CI 的 ISA 门禁在 baseline/modern 产物中
# 检出 zmm 指令。pin 到 1.4.2（仅 AVX2/PCLMULQDQ 变体，无 AVX-512）保持产物低于 x86-64-v4。
crc32fast = "=1.4.2"
image = { version = "0.25", default-features = false, features = [
   "png",
   "jpeg",
   "gif",
   "webp",
] }
webp = "0.3"
arboard = { version = "3.5.0", features = ["wayland-data-control"], optional = true }
maudio = { version = "0.1.6", optional = true }
flume = "0.11"
icy_sixel = "0.5"
unicode-segmentation = "1.11"
unicode-width = "0.2"
syntect = { version = "5.3", default-features = false, optional = true, features = [
   "default-syntaxes",
   "default-themes",
   "regex-fancy",
] }
html-to-markdown-rs = { version = "2.24", default-features = false }
phf = { version = "0.13", features = ["macros"] }
smallvec = { version = "1.15.1", features = [
   "serde",
   "write",
   "union",
   "const_new",
] }
memmap2 = "0.9"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
regex = "1"
tiktoken-rs = "0.7"
similar = "3.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
anyhow = "1.0"
toml = "0.8"
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Regenerate miniaudio FFI bindings from the compiled headers on macOS and Linux ARM64.
# The maudio-sys pregenerated `unix.rs` bindings are Linux-shaped: their
# `ma_device`/`ma_context` backend-state unions omit the `#ifdef
# MA_SUPPORT_COREAUDIO` members that the macOS build of miniaudio.c actually
# contains, so shipping them on darwin is an ABI mismatch that silently breaks
# CoreAudio capture (device init/start succeed but no render callbacks fire).
# darwin builds with host Xcode (libclang available), so bindgen is fine here;
# the hermetic zig/musl/windows toolchains keep the bindgen-free pregen path,
# whose bindings are correct for those platforms.
# On Linux ARM64, the pre-generated bindings have a c_char type mismatch
# (i8 vs u8) that breaks compilation; regenerate with bindgen to get the
# correct ARM64 AAPCS ABI (char = unsigned char = u8).
[target.'cfg(any(target_os = "macos", all(target_os = "linux", target_arch = "aarch64")))'.dependencies]
maudio = { version = "0.1.6", features = ["generate-bindings"], optional = true }
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

windows-sys = { version = "0.61", optional = true, features = [
   "Win32_Foundation",
   "Win32_Storage_ProjectedFileSystem",
   "Win32_System_Com",
   "Win32_System_LibraryLoader",
] }
[build-dependencies]
napi-build = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
