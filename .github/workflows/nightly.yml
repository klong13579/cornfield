# Nightly auto-release — version cadence:
#   daily: bump patch of the latest v* tag (02:00 Beijing = 18:00 UTC)
#   weekly: Beijing Sunday bumps the minor instead (patch resets to 0)
#   major: manual only via `bun scripts/release.ts <X>.0.0`
#
# Skips when main has no commits past the latest tag. On a change the script
# bumps versions, commits, pushes main, tags v<next>, pushes the tag and then
# dispatches ci.yml to build and publish the release.
#
# The dispatch is not belt-and-braces: GITHUB_TOKEN pushes create no workflow
# run, so the tag push on its own leaves a tag nobody builds. Measured
# 2026-09-13 on v1.2.0 — the tag landed and the API reported zero runs for that
# commit. workflow_dispatch is the one event GitHub exempts from that rule,
# which is why `actions: write` is requested below.
#
# This job failed for five consecutive nights (2026-09-07 … 09-11) with nothing
# but a red run nobody watched, which is why the steps below install what a
# fresh runner does not provide instead of assuming it.
name: Nightly auto-release

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Beijing
  workflow_dispatch: # manual trigger for testing

permissions:
  contents: write # push the bump commit, then the tag
  actions: write # dispatch ci.yml to build the release

jobs:
  auto_release:
    runs-on: ubuntu-22.04
    if: github.repository == 'klong13579/cornfield'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      # `cargo generate-lockfile` (auto-release.ts step 4) resolves the workspace
      # crates against the toolchain pinned in rust-toolchain.toml. A runner's
      # preinstalled rustup default is not that toolchain, so install it the same
      # way every Rust job in ci.yml does rather than assume it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
      # A fresh runner has no git identity. Without one, `git commit` dies with
      # "fatal: empty ident name" — which is exactly how the nightly spent
      # 2026-09-10 and 09-11 failing one line before it ever tagged anything.
      # Identity is CI config, not script logic: a developer running
      # auto-release.ts locally should commit under their own name.
      - name: Configure git identity for the bump commit
        run: |
          git config user.name "cornfield-auto-release"
          git config user.email "cornfield-auto-release@users.noreply.github.com"
      - name: Run auto-release (bump + commit + push main + tag + dispatch release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/auto-release.ts

  # 为什么在这里而不是 ci.yml：这个套件测的是 benchmark harness 自身（报告形状、
  # 会话 dump 落盘、任务编排），红了说明 harness 变了，不等于产品坏了——不该给每次 push
  # 当门禁。从 ci.yml 的分片扫描里移出，改成每晚跑一次：静默坏掉一天内就能暴露。
  # 不需要原生 addon：这三个文件不碰 Rust 栈。
  benchmark_harness:
    runs-on: ubuntu-22.04
    if: github.repository == 'klong13579/cornfield'
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Benchmark harness tests
        run: bun --cwd=packages/typescript-edit-benchmark run test
