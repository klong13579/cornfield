# CI — cornfield monorepo
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_npm:
        description: "Skip npm publish"
        type: boolean
        default: false
      trigger_release:
        description: "Build the macOS release artifacts (CLI + desktop) and create a GitHub Release (push triggers are disabled on this repo)"
        type: boolean
        default: false
      dry_run:
        description: "Preflight: run the full release matrix (binaries + desktop) WITHOUT creating the GitHub Release or publishing to npm. release.ts runs this automatically before tagging."
        type: boolean
        default: false
      release_tag:
        description: "Release tag name (e.g. v0.20.0) — required when trigger_release is true"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lint + type check (no Rust, no native build needed)
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Type check workspace
        run: bun run ci:check:full

  detect_rust_changes:
    # Release/tag and manual-release runs always build the full native matrix
    # (linux-x64 + darwin-arm64). For plain main pushes and PRs this job decides
    # whether the change touches the Rust/native stack (crates/, Cargo.toml,
    # Cargo.lock, packages/natives/) and, if so, widens the native matrix to
    # both — so darwin-arm64 breakage surfaces on the branch/PR instead of at
    # release time. Releases are macOS-only: linux-arm64 and win32-x64 are not
    # built anywhere in CI. Verify aarch64-linux changes locally with
    # `bun run build:native:linux-arm64`.
    runs-on: ubuntu-22.04
    outputs:
      rust_changed: ${{ steps.diff.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect Rust-related changes
        id: diff
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # Manual dispatch (incl. the dry-run release preflight) always runs
            # the full matrix. Do not rely on `inputs`/`github.ref` in the
            # matrix include expression below — `inputs` is not reliably
            # evaluated there (observed: a dispatch with trigger_release=true
            # expanded only the linux-x64 job).
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          range=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${GITHUB_SHA}"
          elif [[ "${{ github.ref_type }}" != "tag" ]]; then
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              range="${before}...${GITHUB_SHA}"
            else
              range="HEAD~1...HEAD"
            fi
          fi
          changed=""
          if [[ -n "$range" ]]; then
            changed="$(git diff --name-only "$range" 2>/dev/null || true)"
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]] || echo "$changed" | grep -qE '^(crates/|Cargo\.toml|Cargo\.lock|packages/natives/)'; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust_changed=false" >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: [detect_rust_changes]
    strategy:
      fail-fast: false
      # linux-x64 is not a release platform — it stays because `test` and
      # `test_gateway` download cornfield-natives-linux-x64, and it is the only
      # entry carrying `rust_checks` (clippy / rustfmt / nextest). darwin-arm64
      # is the only shipped platform.
      matrix:
        include: ${{ (startsWith(github.ref, 'refs/tags/v') || needs.detect_rust_changes.outputs.rust_changed == 'true') && fromJSON('[
          {"os":"ubuntu-22.04","platform":"linux","arch":"x64","variants":"baseline modern","rust_checks":true},
          {"os":"macos-14","platform":"darwin","arch":"arm64"}
          ]') || fromJSON('[
          {"os":"ubuntu-22.04","platform":"linux","arch":"x64","variants":"baseline modern","rust_checks":true}
          ]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
          components: ${{ matrix.rust_checks && 'clippy, rustfmt' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch }}
          cache-workspace-crates: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: bun install --frozen-lockfile
      - name: Rust checks
        if: matrix.rust_checks
        run: bun run check:rs
      - uses: taiki-e/install-action@v2
        if: matrix.rust_checks
        with:
          tool: nextest
      - name: Rust tests
        if: matrix.rust_checks
        run: bun run test:rs
      - name: Build native addon(s)
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_VARIANTS: ${{ matrix.variants }}
        shell: bash
        run: |
          bun run ci:build:native
      - name: Upload native addon(s)
        uses: actions/upload-artifact@v5
        with:
          name: cornfield-natives-${{ matrix.platform }}-${{ matrix.arch }}
          path: packages/natives/native/cornfield_natives.${{ matrix.platform }}-${{ matrix.arch }}*.node
          if-no-files-found: error

  test:
    needs: [native]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s $(which fdfind) /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - run: bun install --frozen-lockfile
      - name: Download native addon(s)
        uses: actions/download-artifact@v5
        with:
          name: cornfield-natives-linux-x64
          path: packages/natives/native
      - name: Test workspace (TS shard)
        # --parallel=1: serial file execution stabilizes the worker-level env
        # isolation (parallel workers randomly re-assign files, turning
        # leftover-HOME/env pollution into flaky failures). Serial is
        # deterministic: a leaked env kills the same file every run, which is
        # fixable. Cost ~1.5x wall time, offset by the 4-way shard below.
        # gateway runs in its own job (test_gateway) — its tests carry
        # process-global state (exitCode, wire port, brokers) and the
        # parallel-package sweep made them flaky (0-fail exit-1 runs).
        run: |
          set -e
          for dir in packages/*/; do
            pkg="${dir%/}"
            [ "${pkg##*/}" = "gateway" ] && continue
            [ -f "$pkg/package.json" ] || continue
            grep -q '"test"' "$pkg/package.json" || continue
            (cd "$pkg" && bun run test -- --shard="${{ matrix.shard }}" --parallel=1) &
          done
          wait
      - name: CLI smoke test
        run: bun run ci:test:smoke

  test_gateway:
    # Gateway tests carry process-global state (process.exitCode assertions,
    # wire port, spawned brokers) — inside the parallel-package sweep they
    # intermittently exited 1 with 0 failures (timing-sensitive leftover
    # exitCode). Full suite in its own job: deterministic signal, independent
    # retry, no cross-package interference.
    needs: [native]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s $(which fdfind) /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - run: bun install --frozen-lockfile
      - name: Download native addon(s)
        uses: actions/download-artifact@v5
        with:
          name: cornfield-natives-linux-x64
          path: packages/natives/native
      - name: Test gateway (full suite)
        run: bun --cwd=packages/gateway run test -- --parallel=1

  install_methods:
    if: github.repository == 'klong13579/cornfield'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s $(which fdfind) /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - run: bun install --frozen-lockfile
      - name: Install method smoke tests
        run: bun run ci:test:install-methods

  check_latest_tag:
    runs-on: ubuntu-22.04
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare this tag against the highest version tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.trigger_release }}" == "true" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag --sort=-v:refname | head -n 1)"
          echo "this=${{ github.ref_name }} latest=$latest"
          if [[ "$latest" == "${{ github.ref_name }}" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  release_binary:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true)) && needs.check_latest_tag.outputs.is_latest == 'true'
    needs: [check_latest_tag, check, native]
    strategy:
      fail-fast: false
      # Single-entry matrix on purpose: releases are macOS-only. The job body is
      # platform-agnostic, so re-adding a platform is one entry here plus the
      # matching RELEASE_TARGETS in the `release` job below.
      matrix:
        include:
          - os: macos-14
            target_id: darwin-arm64
            native_artifact: cornfield-natives-darwin-arm64
            binary_path: packages/coding-agent/binaries/cornfield-darwin-arm64
            gateway_path: packages/coding-agent/binaries/cornfield-gateway-darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download native addon(s)
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.native_artifact }}
          path: packages/natives/native
      - name: Build release binary
        env:
          RELEASE_TARGETS: ${{ matrix.target_id }}
        run: bun run ci:release:build-binaries
      - name: Smoke release binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.gateway_path }}" --version
      - name: Upload release binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: cornfield-binary-${{ matrix.target_id }}
          path: |
            ${{ matrix.binary_path }}
            ${{ matrix.gateway_path }}

  release_desktop:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true)) && needs.check_latest_tag.outputs.is_latest == 'true'
    needs: [check_latest_tag, check, native]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download native addon(s)
        uses: actions/download-artifact@v5
        with:
          name: cornfield-natives-darwin-arm64
          path: packages/natives/native
      - name: Build desktop app (dmg + zip + latest.yml)
        run: bun run build:desktop
        working-directory: packages/desktop
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v5
        with:
          name: cornfield-desktop-darwin-arm64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true)
    needs: [release_binary, release_desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
      # The shipped target set, in one place for this job: the native addons it
      # verifies and publishes, and the archives it builds. macOS-only — the
      # linux-x64 natives in this run exist for the test jobs, not for release.
      RELEASE_TARGETS: darwin-arm64
      PI_NATIVE_EXPECTED_ADDONS: darwin-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download release binaries
        uses: actions/download-artifact@v5
        with:
          pattern: cornfield-binary-*
          path: packages/coding-agent/binaries
          merge-multiple: true
      - name: Download desktop artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cornfield-desktop-*
          path: packages/desktop/dist
          merge-multiple: true
      - name: Download native addons
        uses: actions/download-artifact@v5
        with:
          pattern: cornfield-natives-darwin-*
          path: packages/natives/native
          merge-multiple: true
      - name: Verify native addons
        run: bun run ci:release:verify-natives
      - name: Stage native addons for release
        run: cp packages/natives/native/*.node packages/coding-agent/binaries/
      - name: Build release archives
        run: bun run ci:release:build-archives
      - name: Validate release tag (dispatch mode)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag input is required when trigger_release is true" >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # Skipped in dry-run preflight (workflow_dispatch with dry_run=true):
        # release_binary / release_desktop still build the shipped artifacts so
        # the preflight validates the macOS release path the tag push will re-run.
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        with:
          tag_name: "${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag) || github.ref_name }}"
          files: |
            packages/coding-agent/binaries/*
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.yml
            packages/desktop/dist/*.blockmap
          generate_release_notes: true
      - name: Publish to npm
        if: ${{ !inputs.skip_npm && !inputs.dry_run && env.NPM_TOKEN_SET == 'true' }}
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run ci:release:publish

  notify_release_failure:
    # A release run (tag push or manual release dispatch) that fails is a publish
    # incident. Surface it on DingTalk instead of letting the "release stuck /
    # nobody noticed" situation repeat (v1.1.0 sat broken for a day). Requires the
    # DINGTALK_RELEASE_WEBHOOK repo secret (DingTalk group robot webhook); skips
    # silently when unset.
    if: failure() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true))
    needs: [release]
    runs-on: ubuntu-22.04
    steps:
      - name: Notify release failure via DingTalk
        env:
          WEBHOOK: ${{ secrets.DINGTALK_RELEASE_WEBHOOK }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "DINGTALK_RELEASE_WEBHOOK secret not set; skipping notification"
            exit 0
          fi
          body="{\"msgtype\":\"text\",\"text\":{\"content\":\"[cornfield] release 失败: ${REF} ${RUN_URL}\"}}"
          curl -sS -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d "$body"
