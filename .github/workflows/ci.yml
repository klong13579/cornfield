# CI — cornfield monorepo
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_npm:
        description: "Skip npm publish"
        type: boolean
        default: false
      trigger_release:
        description: "Build the macOS release artifacts (CLI + desktop) and create a GitHub Release (push triggers are disabled on this repo)"
        type: boolean
        default: false
      dry_run:
        description: "Manual valve: build the release artifacts (binaries + desktop) WITHOUT creating the GitHub Release or publishing to npm. No automated flow uses this — release.ts and the nightly auto-release publish in one pass."
        type: boolean
        default: false
      release_tag:
        description: "Release tag name (e.g. v0.20.0) — required when trigger_release is true"
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast lint + type check (no Rust, no native build needed)
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Type check workspace
        run: bun run ci:check:full

  detect_rust_changes:
    # Decides whether this run builds cornfield-natives for darwin-arm64 (the
    # only shipped platform) or just for linux-x64 (which exists for the test
    # jobs). Release/tag runs and manual dispatches always build both. For
    # plain main pushes and PRs, a change touching the Rust/native stack
    # (crates/, Cargo.toml, Cargo.lock, packages/natives/) also builds
    # darwin-arm64 — so darwin breakage surfaces on the branch/PR instead of at
    # release time. Releases are macOS-only: linux-arm64 and win32-x64 are not
    # built anywhere in CI. Verify aarch64-linux changes locally with
    # `bun run build:native:linux-arm64`.
    runs-on: ubuntu-22.04
    outputs:
      rust_changed: ${{ steps.diff.outputs.rust_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect Rust-related changes
        id: diff
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # A dispatch means "build everything": release runs
            # (trigger_release=true) need darwin-arm64, and a manual CI run is
            # someone asking for the full set.
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          range=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${GITHUB_SHA}"
          elif [[ "${{ github.ref_type }}" != "tag" ]]; then
            before="${{ github.event.before }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              range="${before}...${GITHUB_SHA}"
            else
              range="HEAD~1...HEAD"
            fi
          fi
          changed=""
          if [[ -n "$range" ]]; then
            changed="$(git diff --name-only "$range" 2>/dev/null || true)"
          fi
          if [[ "${{ github.ref_type }}" == "tag" ]] || echo "$changed" | grep -qE '^(crates/|Cargo\.toml|Cargo\.lock|packages/natives/)'; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # linux-x64 is not a release platform — it exists because `test` and
  # `test_gateway` download cornfield-natives-linux-x64, and it is the only job
  # carrying the Rust checks (clippy / rustfmt / nextest). It also builds two
  # addon variants for those test jobs.
  native_linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
          components: clippy, rustfmt
      # shared-key, not key: the cache belongs to the platform, not to this
      # job's name (the automatic job-based key changes whenever the job is
      # renamed, which turns a rename into a full cold rebuild).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-x64
          cache-workspace-crates: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: bun install --frozen-lockfile
      - name: Rust checks
        run: bun run check:rs
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Rust tests
        run: bun run test:rs
      - name: Build native addon(s)
        env:
          TARGET_PLATFORM: linux
          TARGET_ARCH: x64
          TARGET_VARIANTS: baseline modern
        shell: bash
        run: |
          bun run ci:build:native
      - name: Upload native addon(s)
        uses: actions/upload-artifact@v5
        with:
          name: cornfield-natives-linux-x64
          path: packages/natives/native/cornfield_natives.linux-x64*.node
          if-no-files-found: error

  # darwin-arm64 is the only shipped platform, and it is the only native job the
  # release jobs wait for. detect_rust_changes reports true for tags and for
  # dispatches, so a release run always builds it.
  native_darwin:
    if: needs.detect_rust_changes.outputs.rust_changed == 'true'
    needs: [detect_rust_changes]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: darwin-arm64
          cache-workspace-crates: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: bun install --frozen-lockfile
      - name: Build native addon(s)
        env:
          TARGET_PLATFORM: darwin
          TARGET_ARCH: arm64
        shell: bash
        run: |
          bun run ci:build:native
      - name: Upload native addon(s)
        uses: actions/upload-artifact@v5
        with:
          name: cornfield-natives-darwin-arm64
          path: packages/natives/native/cornfield_natives.darwin-arm64*.node
          if-no-files-found: error

  test:
    needs: [native_linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s $(which fdfind) /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - run: bun install --frozen-lockfile
      - name: Download native addon(s)
        uses: actions/download-artifact@v5
        with:
          name: cornfield-natives-linux-x64
          path: packages/natives/native
      - name: Test workspace (TS shard)
        # --parallel=1: serial file execution stabilizes the worker-level env
        # isolation (parallel workers randomly re-assign files, turning
        # leftover-HOME/env pollution into flaky failures). Serial is
        # deterministic: a leaked env kills the same file every run, which is
        # fixable. Cost ~1.5x wall time, offset by the 4-way shard below.
        # gateway runs in its own job (test_gateway) — its tests carry
        # process-global state (exitCode, wire port, brokers) and the
        # parallel-package sweep made them flaky (0-fail exit-1 runs).
        run: |
          set -e
          pids=()
          for dir in packages/*/; do
            pkg="${dir%/}"
            [ "${pkg##*/}" = "gateway" ] && continue
            [ -f "$pkg/package.json" ] || continue
            grep -q '"test"' "$pkg/package.json" || continue
            (cd "$pkg" && bun run test -- --shard="${{ matrix.shard }}" --parallel=1) &
            pids+=("$!")
          done
          # `wait` with no operands returns 0 no matter what the children did, so a
          # failing package never failed this step — green runs carried failure-level
          # annotations (2026-09-16: three compaction tests hung for weeks behind this).
          # Wait on each pid and fail if any of them failed.
          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done
          exit "$fail"
      - name: CLI smoke test
        run: bun run ci:test:smoke

  test_gateway:
    # Gateway tests carry process-global state (process.exitCode assertions,
    # wire port, spawned brokers) — inside the parallel-package sweep they
    # intermittently exited 1 with 0 failures (timing-sensitive leftover
    # exitCode). Full suite in its own job: deterministic signal, independent
    # retry, no cross-package interference.
    needs: [native_linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s $(which fdfind) /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - run: bun install --frozen-lockfile
      - name: Download native addon(s)
        uses: actions/download-artifact@v5
        with:
          name: cornfield-natives-linux-x64
          path: packages/natives/native
      - name: Test gateway (full suite)
        run: bun --cwd=packages/gateway run test -- --parallel=1

  install_methods:
    if: github.repository == 'klong13579/cornfield'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-04-29
      - uses: Swatinem/rust-cache@v2
        with:
          cache-workspace-crates: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep imagemagick
          sudo ln -s $(which fdfind) /usr/local/bin/fd
          sudo ln -sf /usr/bin/convert /usr/local/bin/magick
      - run: bun install --frozen-lockfile
      - name: Install method smoke tests
        # STATS_CLIENT_NO_WAIT: run-ci.sh owns this build top to bottom and runs
        # it sequentially — nothing else can be writing packages/stats/dist/client,
        # so the generator's 120s race-wait would only burn its full timeout.
        env:
          STATS_CLIENT_NO_WAIT: "1"
        run: bun run ci:test:install-methods

  check_latest_tag:
    runs-on: ubuntu-22.04
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare this tag against the highest version tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.trigger_release }}" == "true" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest="$(git tag --sort=-v:refname | head -n 1)"
          echo "this=${{ github.ref_name }} latest=$latest"
          if [[ "$latest" == "${{ github.ref_name }}" ]]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  release_binary:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true)) && needs.check_latest_tag.outputs.is_latest == 'true'
    # native_darwin, not every native job: linux-x64 is not a release platform
    # and takes twice as long on a release run.
    needs: [check_latest_tag, check, native_darwin]
    strategy:
      fail-fast: false
      # Single-entry matrix on purpose: releases are macOS-only. The job body is
      # platform-agnostic, so re-adding a platform is one entry here plus the
      # matching RELEASE_TARGETS in the `release` job below.
      matrix:
        include:
          - os: macos-14
            target_id: darwin-arm64
            native_artifact: cornfield-natives-darwin-arm64
            binary_path: packages/coding-agent/binaries/cornfield-darwin-arm64
            gateway_path: packages/coding-agent/binaries/cornfield-gateway-darwin-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download native addon(s)
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.native_artifact }}
          path: packages/natives/native
      - name: Build release binary
        env:
          RELEASE_TARGETS: ${{ matrix.target_id }}
        run: bun run ci:release:build-binaries
      - name: Smoke release binary
        run: |
          runtime_dir="$(mktemp -d)"
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.binary_path }}" --version
          HOME="$runtime_dir/home" XDG_DATA_HOME="$runtime_dir/xdg" "${{ matrix.gateway_path }}" --version
      - name: Upload release binary artifact
        uses: actions/upload-artifact@v5
        with:
          name: cornfield-binary-${{ matrix.target_id }}
          path: |
            ${{ matrix.binary_path }}
            ${{ matrix.gateway_path }}

  release_desktop:
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true)) && needs.check_latest_tag.outputs.is_latest == 'true'
    # The desktop app bundles the CLI binary and the renderer, and nothing else
    # it builds itself. Everything it needs already exists by the time
    # release_binary finishes, so it waits for that and reuses the artifact.
    needs: [check_latest_tag, check, native_darwin, release_binary]
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download release binary
        uses: actions/download-artifact@v5
        with:
          name: cornfield-binary-darwin-arm64
          path: packages/coding-agent/binaries
      - name: Build desktop app (dmg + zip + latest.yml)
        # --agent-binary bundles the binary release_binary just built from this
        # same commit. Without it this step rebuilds the Rust addon and the CLI
        # binary from source — measured 2026-09-13 on v1.2.0: 6m of the 7m34
        # step was that rebuild, while electron-builder itself took 38s.
        run: bun scripts/build.ts --agent-binary ../coding-agent/binaries/cornfield-darwin-arm64
        working-directory: packages/desktop
      - name: Upload desktop artifact
        uses: actions/upload-artifact@v5
        with:
          name: cornfield-desktop-darwin-arm64
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.blockmap

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true)
    needs: [release_binary, release_desktop]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      NPM_TOKEN_SET: ${{ secrets.NPM_TOKEN != '' }}
      # The shipped target set, in one place for this job: the native addons it
      # verifies and publishes, and the archives it builds. macOS-only — the
      # linux-x64 natives in this run exist for the test jobs, not for release.
      RELEASE_TARGETS: darwin-arm64
      PI_NATIVE_EXPECTED_ADDONS: darwin-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Cache bun dependencies
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Download release binaries
        uses: actions/download-artifact@v5
        with:
          pattern: cornfield-binary-*
          path: packages/coding-agent/binaries
          merge-multiple: true
      - name: Download desktop artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: cornfield-desktop-*
          path: packages/desktop/dist
          merge-multiple: true
      - name: Download native addons
        uses: actions/download-artifact@v5
        with:
          pattern: cornfield-natives-darwin-*
          path: packages/natives/native
          merge-multiple: true
      - name: Verify native addons
        run: bun run ci:release:verify-natives
      - name: Stage native addons for release
        run: cp packages/natives/native/*.node packages/coding-agent/binaries/
      - name: Build release archives
        run: bun run ci:release:build-archives
      - name: Validate release tag (dispatch mode)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ -z "${{ inputs.release_tag }}" ]]; then
            echo "release_tag input is required when trigger_release is true" >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        # Skipped for a manual dry run (workflow_dispatch with dry_run=true):
        # release_binary / release_desktop still build the shipped artifacts, so
        # the run validates the macOS release path without publishing anything.
        if: github.event_name != 'workflow_dispatch' || !inputs.dry_run
        with:
          # Dispatch mode runs from `main`: the tag does not exist yet, this step
          # creates it. target_commitish pins it to the commit this run built —
          # without it the tag is created wherever the default branch points when
          # the release is created, which is a different commit as soon as anyone
          # pushes to main mid-run.
          target_commitish: ${{ github.sha }}
          tag_name: "${{ (github.event_name == 'workflow_dispatch' && inputs.release_tag) || github.ref_name }}"
          files: |
            packages/coding-agent/binaries/*
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/latest*.yml
            packages/desktop/dist/*.blockmap
          generate_release_notes: true
      - name: Publish to npm
        if: ${{ !inputs.skip_npm && !inputs.dry_run && env.NPM_TOKEN_SET == 'true' }}
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: bun run ci:release:publish

  notify_release_failure:
    # A release run (tag push or manual release dispatch) that fails is a publish
    # incident. Surface it on DingTalk instead of letting the "release stuck /
    # nobody noticed" situation repeat (v1.1.0 sat broken for a day). Requires the
    # DINGTALK_RELEASE_WEBHOOK repo secret (DingTalk group robot webhook); skips
    # silently when unset.
    if: failure() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.trigger_release == true))
    needs: [release]
    runs-on: ubuntu-22.04
    steps:
      - name: Notify release failure via DingTalk
        env:
          WEBHOOK: ${{ secrets.DINGTALK_RELEASE_WEBHOOK }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          if [[ -z "$WEBHOOK" ]]; then
            echo "DINGTALK_RELEASE_WEBHOOK secret not set; skipping notification"
            exit 0
          fi
          body="{\"msgtype\":\"text\",\"text\":{\"content\":\"[cornfield] release 失败: ${REF} ${RUN_URL}\"}}"
          curl -sS -X POST "$WEBHOOK" -H 'Content-Type: application/json' -d "$body"
