<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CornField Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    }
    .logo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #0f0f0f 100%);
      overflow: hidden;
    }
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image:
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .circuit {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.15;
    }
    .circuit.left { left: 38px; }
    .circuit.right { right: 38px; }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .logo-container .content { gap: 20px; }
    .icon-container {
      position: relative;
      filter: drop-shadow(0 0 48px rgba(255,255,255,0.12));
    }
    .title {
      font-size: 44px;
      font-weight: 700;
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.92);
      text-shadow: 0 0 40px rgba(255,255,255,0.15);
      text-transform: uppercase;
    }
    .tagline {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.4);
    }
    .tagline .bracket { font-size: 18px; font-weight: 300; }
    .tagline .text { font-size: 14px; letter-spacing: 0.4em; text-transform: uppercase; }
    .status {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.05em;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: rgba(255,255,255,0.1);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: 16px; left: 16px; border-top-width: 2px; border-left-width: 2px; }
    .corner.tr { top: 16px; right: 16px; border-top-width: 2px; border-right-width: 2px; }
    .corner.bl { bottom: 16px; left: 16px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 16px; right: 16px; border-bottom-width: 2px; border-right-width: 2px; }
    .bottom-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 96px;
      opacity: 0.5;
      background: linear-gradient(to top, rgba(255,255,255,0.04), transparent);
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="grid"></div>

    <!-- Circuit traces - left -->
    <svg class="circuit left" width="60" height="200" viewBox="0 0 60 200">
      <path d="M30 0 L30 60 L10 80 L10 120 L30 140 L30 200" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
      <circle cx="30" cy="60" r="4" fill="rgba(255,255,255,0.5)"/>
      <circle cx="10" cy="80" r="3" fill="rgba(255,255,255,0.4)"/>
      <circle cx="10" cy="120" r="3" fill="rgba(255,255,255,0.4)"/>
      <circle cx="30" cy="140" r="4" fill="rgba(255,255,255,0.5)"/>
      <rect x="5" y="95" width="10" height="10" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    </svg>

    <!-- Circuit traces - right -->
    <svg class="circuit right" width="60" height="200" viewBox="0 0 60 200">
      <path d="M30 0 L30 60 L50 80 L50 120 L30 140 L30 200" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
      <circle cx="30" cy="60" r="4" fill="rgba(255,255,255,0.5)"/>
      <circle cx="50" cy="80" r="3" fill="rgba(255,255,255,0.4)"/>
      <circle cx="50" cy="120" r="3" fill="rgba(255,255,255,0.4)"/>
      <circle cx="30" cy="140" r="4" fill="rgba(255,255,255,0.5)"/>
      <rect x="45" y="95" width="10" height="10" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    </svg>

    <div class="content">
      <div class="icon-container">
        <svg width="120" height="120" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="36" height="36" rx="5" fill="#1D1D1F"/>
          <path d="M8 18.5266C8 16.5216 8.45212 14.7229 9.35637 13.1306C10.2606 11.5187 11.4892 10.2606 13.0422 9.35637C14.6148 8.45212 16.3545 8 18.2613 8C20.5022 8 22.4582 8.54058 24.1291 9.62175C25.7999 10.7029 27.0187 12.2362 27.7854 14.2216H24.5713C24.0013 12.9832 23.1757 12.0298 22.0945 11.3614C21.033 10.6931 19.7552 10.3589 18.2613 10.3589C16.8263 10.3589 15.5387 10.6931 14.3985 11.3614C13.2584 12.0298 12.364 12.9832 11.7153 14.2216C11.0666 15.4404 10.7422 16.8754 10.7422 18.5266C10.7422 20.1582 11.0666 21.5932 11.7153 22.8316C12.364 24.0504 13.2584 24.994 14.3985 25.6623C15.5387 26.3307 16.8263 26.6649 18.2613 26.6649C19.7552 26.6649 21.033 26.3405 22.0945 25.6918C23.1757 25.0235 24.0013 24.0701 24.5713 22.8316H27.7854C27.0187 24.7974 25.7999 26.3209 24.1291 27.402C22.4582 28.4635 20.5022 28.9943 18.2613 28.9943C16.3545 28.9943 14.6148 28.552 13.0422 27.6674C11.4892 26.7632 10.2606 25.5149 9.35637 23.9226C8.45212 22.3304 8 20.5317 8 18.5266Z" fill="white"/>
          <circle cx="26.4674" cy="18.5531" r="2.19961" fill="white"/>
        </svg>
      </div>

      <div class="title">cornfield</div>

      <div class="tagline">
        <span class="bracket">[</span>
        <span class="text">ai coding agent</span>
        <span class="bracket">]</span>
      </div>

      <div class="status">
        <div class="status-dot"></div>
        <span>MCP · LSP · Subagents · Web Search</span>
      </div>
    </div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="bottom-glow"></div>
  </div>
</body>
</html>
