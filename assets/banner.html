<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CornField Logo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      font-family: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    }
    .logo-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #0d0d0d 0%, #1a1a1a 50%, #0f0f0f 100%);
      overflow: hidden;
    }
    .grid {
      position: absolute;
      inset: 0;
      opacity: 0.03;
      background-image:
        linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    .circuit {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.15;
    }
    .circuit.left { left: 38px; }
    .circuit.right { right: 38px; }
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .logo-container .content { gap: 20px; }
    .icon-container {
      position: relative;
      filter: drop-shadow(0 0 48px rgba(255,255,255,0.12));
    }
    .title {
      display: flex;
      justify-content: center;
      filter: drop-shadow(0 0 40px rgba(255,255,255,0.12));
    }
    .tagline {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255,255,255,0.4);
    }
    .tagline .bracket { font-size: 18px; font-weight: 300; }
    .tagline .text { font-size: 14px; letter-spacing: 0.4em; text-transform: uppercase; }
    .status {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.05em;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .corner {
      position: absolute;
      width: 32px;
      height: 32px;
      border-color: rgba(255,255,255,0.1);
      border-style: solid;
      border-width: 0;
    }
    .corner.tl { top: 16px; left: 16px; border-top-width: 2px; border-left-width: 2px; }
    .corner.tr { top: 16px; right: 16px; border-top-width: 2px; border-right-width: 2px; }
    .corner.bl { bottom: 16px; left: 16px; border-bottom-width: 2px; border-left-width: 2px; }
    .corner.br { bottom: 16px; right: 16px; border-bottom-width: 2px; border-right-width: 2px; }
    .bottom-glow {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 96px;
      opacity: 0.5;
      background: linear-gradient(to top, rgba(255,255,255,0.04), transparent);
    }
  </style>
</head>

      <circle cx="10" cy="80" r="3" fill="rgba(255,255,255,0.4)"/>
      <circle cx="10" cy="120" r="3" fill="rgba(255,255,255,0.4)"/>
      <circle cx="30" cy="140" r="4" fill="rgba(255,255,255,0.5)"/>
      <rect x="5" y="95" width="10" height="10" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1.5"/>
    </svg>
